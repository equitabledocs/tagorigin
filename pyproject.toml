[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagorigin"
version = "0.1.0"
description = "Classify the provenance of a PDF's tag tree: authoring-tool auto-export vs deliberate accessibility remediation."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "EquitableDocs"}
]
requires-python = ">=3.10"
keywords = ["pdf", "accessibility", "wcag", "pdf-ua", "remediation", "provenance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pikepdf>=8.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "pypdfium2>=4.20",
]

[project.optional-dependencies]
vision = [
    "anthropic>=0.30",
    "openai>=1.30",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
tagorigin = "tagorigin.cli:app"

[project.urls]
Homepage = "https://github.com/equitabledocs/tagorigin"
Documentation = "https://github.com/equitabledocs/tagorigin/blob/main/docs/SPEC.md"
Issues = "https://github.com/equitabledocs/tagorigin/issues"

[tool.setuptools.packages.find]
include = ["tagorigin*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
